<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href = "css/site.css">
    <title>Meu primeiro e-commerce</title>
</head>
    <body>
        <div class="header">
            <h1>Loja de roupas e acessórios</h1>
        </div>
        <nav>
            <li><a href="#">Home</a></li>
            <li><a href="#">Roupa</a></li>
            <li><a href="#">Acessórios</a></li>
            <li><a href="#" id="carrinho-compras">Carrinho de compras</a></li>
            <div class="filtros-container">
                <div class="filtro">
                    <label for="preco">Preço:</label>
                    <select id="preco">
                    <option value="menor">Menor preço</option>
                    <option value="maior">Maior preço</option>
                    </select>
                </div>
            </div>
        </nav>
        <section class="produtos">
            <div class="produto">
                <img src="assets/img/bone-highjpg.jpg" alt="img-produto1">
                <h3>Boné High</h3>
                <p class="valor-item">R$49,90</p>
                <button>COMPRAR</button>
            </div>
            <div class="produto">
                <img src="assets/img/jaqueta.jpg" alt="img-produto2">
                <h3>Jaqueta Jersey</h3>
                <p class="valor-item">R$99,90</p>
                <button>COMPRAR</button>
            </div>
            <div class="produto">
                <img src="assets/img/bone.jpg" alt="img-produto1">
                <h3>Boné</h3>
                <p class="valor-item">R$69,90</p>
                <button>COMPRAR</button>
            </div>
            <div class="produto">
                <img src="assets/img/moletom-fear-of-godjpg.jpg" alt="img-produto2">
                <h3>Moletom Fear Of God</h3>
                <p class="valor-item">R$199,90</p>
                <button>COMPRAR</button>
            </div>
        </section>
        <footer>
            <p>&copy; 2025 Loja virutal</p>
        </footer>
        <script src="js/site.js"></script>
    </body>
</html>
